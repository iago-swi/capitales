# Publishes a GitHub release for a version tag, using the matching section of the
# changelog as release notes. See VERSIONING.md. Adapted from iago-swi/styx.
#
#   claude-v1.1.0   ->  Claude/CHANGELOG.md, section "## [1.1.0]", title "Capitales 1.1.0 (Claude)"
#   chatgpt-v1.0.0  ->  ChatGPT/CHANGELOG.md, section "## [1.0.0]", title "Capitales 1.0.0 (ChatGPT)"
name: Release

on:
  push:
    tags:
      - '*-v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish or refresh, for example claude-v1.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Publish the release notes from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # Split the tag into the folder prefix and the version.
          [[ "$TAG" =~ ^([a-z0-9]+)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]] \
            || fail "Tag '$TAG' is not <folder>-vX.Y.Z"
          prefix="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"

          # The prefix names a folder, whatever its capitals: chatgpt -> ChatGPT.
          folder="$(find . -mindepth 1 -maxdepth 1 -type d -iname "$prefix" -printf '%f\n' | head -n 1)"
          [[ -n "$folder" ]] || fail "No folder matches the tag prefix '$prefix'"
          log="$folder/CHANGELOG.md"
          [[ -f "$log" ]] || fail "$log does not exist"

          # Notes: everything under "## [version]" up to the next "## " heading,
          # without the link definitions kept at the bottom of the file.
          awk -v v="$version" '
            /^## /          { on = (index($0, "## [" v "]") == 1); next }
            /^\[[^]]+\]: /  { next }
            on              { print }
          ' "$log" | sed -e '/./,$!d' > notes.md
          grep -q '[^[:space:]]' notes.md || fail "$log has no section '## [$version]'"

          # The version in the folder's package.json must be the one being released.
          # Only checked for a pushed tag, where the files are those of the tagged commit.
          manifest="$folder/package.json"
          if [[ "$GITHUB_EVENT_NAME" == "push" && -f "$manifest" ]]; then
            declared="$(jq -r '.version // empty' "$manifest")"
            if [[ -n "$declared" && "$declared" != "$version" ]]; then
              fail "$manifest declares version $declared, but the tag says $version"
            fi
          fi

          # Title: the name in the changelog's first heading ("# Capitales changelog"),
          # the version, and the folder: "Capitales 1.1.0 (Claude)".
          name="$(grep -m 1 '^# ' "$log" | sed -E 's/^# +//; s/ +changelog$//I' || true)"
          if [[ -z "$name" || "${name,,}" == "changelog" ]]; then name="Capitales"; fi
          title="$name $version ($folder)"

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file notes.md
            echo "Updated the notes of $title"
          else
            gh release create "$TAG" --verify-tag --title "$title" --notes-file notes.md
            echo "Published $title"
          fi
