<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Capitales — two versions</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101827; color: #f8fafc; }
      main { width: min(760px, calc(100% - 2rem)); text-align: center; }
      h1 { font-size: clamp(2.5rem, 8vw, 5rem); margin-bottom: .4rem; }
      p { color: #cbd5e1; font-size: 1.1rem; }
      .variants { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-top: 2.5rem; }
      a { padding: 2rem 1rem; border: 1px solid #334155; border-radius: 1rem; color: inherit; text-decoration: none; background: #1e293b; transition: transform .2s, border-color .2s; }
      a:hover { transform: translateY(-3px); border-color: #38bdf8; }
      strong { display: block; font-size: 1.5rem; margin-bottom: .4rem; }
      span { color: #94a3b8; }
    </style>
  </head>
  <body>
    <main>
      <h1>Capitales</h1>
      <p>One game, built twice: try both and compare.</p>
      <div class="variants">
        <a href="claude/"><strong>Claude version</strong><span>Open this version</span></a>
        <a href="chatgpt/"><strong>ChatGPT version</strong><span>Open this version</span></a>
      </div>
    </main>
  </body>
</html>
